<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Quizzes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #e6f0fa 0%, #c0d8e7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #8e5af0;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #34495e;
      font-weight: 700;
    }
    .messages {
      margin-bottom: 20px;
    }
    .messages p {
      background: #e8f4f8;
      padding: 10px;
      border-radius: 5px;
      color: #8e5af0;
      font-weight: 500;
    }
    ul.quiz-list {
      list-style: none;
      text-align: left;
    }
    ul.quiz-list li {
      margin: 15px 0;
      padding: 12px 20px;
      background: #ecf0f1;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    ul.quiz-list li:hover {
      background: #d5e1f0;
      transform: translateX(10px);
    }
    ul.quiz-list li a {
      text-decoration: none;
      color: #8e5af0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    ul.quiz-list li a:hover {
      color: #6c3483;
    }
    .empty-message {
      color: #7f8c8d;
      font-style: italic;
      padding: 15px;
    }
    .back-btn {
      padding: 10px 20px;
      background: linear-gradient(45deg, #8e44ad 0%, #6c3483 100%);
      color: #ffffff;
      border-radius: 8px;
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: linear-gradient(45deg, #6c3483 0%, #5b2c6f 100%);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(142, 68, 173, 0.4);
    }
    @media (max-width: 480px) {
      h1 {
        font-size: 2rem;
      }
      .container {
        padding: 20px;
      }
      ul.quiz-list li {
        padding: 10px;
        font-size: 1rem;
      }
      .back-btn {
        padding: 8px 15px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Available Quizzes</h1>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    <ul class="quiz-list">
      {% for quiz_type in quiz_types %}
        <li><a href="{% url 'take_quiz' quiz_type.id %}">{{ quiz_type.name }}</a></li>
      {% empty %}
        <li class="empty-message">No quizzes available. Please create one.</li>
      {% endfor %}
    </ul>
    <a href="{% url 'home' %}"class="back-btn" aria-label="Back to dashboard">Back to Dashboard</a>
  </div>
</body>
</html>
