<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Analytics - Looker Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e6f0fa 0%, #c0d8e7 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #34495e;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .iframe-container {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .back-btn {
            padding: 12px 25px;
            background: linear-gradient(45deg, #8e44ad 0%, #6c3483 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: linear-gradient(45deg, #6c3483 0%, #5b2c6f 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.4);
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            h1 { font-size: 2rem; }
            .iframe-container { height: 600px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Quiz Analytics Dashboard</h1>
        <p style="color: #7f8c8d; margin-bottom: 20px;">
            Live data from your quiz responses • Updates every 15 minutes
        </p>
        
        <!-- PASTE YOUR LOOKER STUDIO EMBED URL HERE -->
       <iframe width="1200" height="784" src="https://lookerstudio.google.com/embed/reporting/e16220ab-ba88-4632-ac21-ac059bdcab6c/page/huncF" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
        
        <a href="{% url 'quiz_dashboard' %}" class="back-btn">← Back to Dashboard</a>
    </div>
</body>
</html>
