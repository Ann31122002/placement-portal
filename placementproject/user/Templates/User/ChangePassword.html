<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Placement Training Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3e8ff, #e6e6fa);
        }
        .navbar {
            transition: background 0.3s ease;
            background: linear-gradient(180deg, #6b46c1, #8e5af0);
        }
        .navbar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(2px);
            transition: all 0.3s ease;
        }
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .btn {
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            background: linear-gradient(to right, #6b46c1, #8e5af0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-message {
            color: #dc2626;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="min-h-screen">
        <!-- Navbar -->
        <div id="navbar" class="navbar bg-purple-900 text-white p-4 md:p-6 shadow-lg z-20">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="{% url 'Users:Profile' %}" class="block py-2 px-4 bg-purple-600 rounded-lg text-lg hover:bg-purple-700">Profile</a>
                    <h2 class="text-2xl md:text-3xl font-bold">Placement Portal</h2>
                </div>
                <div class="flex items-center space-x-6">
                    <nav class="hidden md:flex space-x-6">
                        <a href="index.html#overview" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Overview</a>
                        <a href="index.html#training" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Training</a>
                        <a href="index.html#assessments" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Assessments</a>
                        <a href="index.html#resources" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Resources</a>
                        <a href="{% url 'Users:ChangePassword' %}" class="block py-2 px-4 bg-purple-600 rounded-lg text-lg hover:bg-purple-700">Change Password</a>
                    </nav>
                    <a href="{% url 'Users:Logout' %}" class="block py-2 px-4 bg-purple-600 rounded-lg text-lg hover:bg-purple-700">Logout</a>
                    <!-- Mobile Menu Toggle -->
                    <button id="menuToggle" class="md:hidden p-2 bg-purple-600 text-white rounded-lg shadow-md hover:bg-purple-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Mobile Menu -->
            <nav id="mobileMenu" class="md:hidden mt-4 space-y-2 hidden">
                <a href="index.html#overview" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Overview</a>
                <a href="index.html#training" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Training</a>
                <a href="index.html#assessments" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Assessments</a>
                <a href="index.html#resources" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Resources</a>
                <a href="{% url 'Users:Profile' %}" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Profile</a>
                <a href="#" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-auto">
            <!-- Change Password Section -->
            <section id="change-password" class="mb-10">
                <h1 class="text-4xl font-bold mb-6">Change Password</h1>
                <div class="card bg-white p-6 rounded-2xl shadow-lg">
                    <form id="change-password-form" class="space-y-4">
                        <div>
                            <label for="txt_pass" class="block text-gray-600 font-semibold">Current Password</label>
                            <input type="password" id="txt_pass" name="txt_pass" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                        </div>
                        <div>
                            <label for="txt_new" class="block text-gray-600 font-semibold">New Password</label>
                            <input type="password" id="txt_new" name="txt_new" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                        </div>
                        <div>
                            <label for="txt_con" class="block text-gray-600 font-semibold">Confirm New Password</label>
                            <input type="password" id="txt_con" name="txt_con" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" required>
                        </div>
                        <div class="flex space-x-4">
                            <button type="submit" class="btn bg-gradient-to-r from-purple-500 to-purple-700 text-white px-6 py-2 rounded-lg font-semibold">Save Changes</button>
                            <button type="button" id="cancel-btn" class="btn bg-gradient-to-r from-red-500 to-red-700 text-white px-6 py-2 rounded-lg font-semibold">Cancel</button>
                        </div>
                        <p id="error-message" class="error-message hidden"></p>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        const changePasswordForm = document.getElementById('change-password-form');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMessage = document.getElementById('error-message');

        // Mobile menu toggle
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Smooth scrolling for nav links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
                if (window.innerWidth < 768) {
                    mobileMenu.classList.add('hidden');
                }
            });
        });

        // Change password form validation
        changePasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('txt_pass').value;
            const newPassword = document.getElementById('txt_new').value;
            const confirmPassword = document.getElementById('txt_con').value;

            // Basic validation
            if (newPassword.length < 6) {
                errorMessage.textContent = 'New password must be at least 6 characters long.';
                errorMessage.classList.remove('hidden');
                return;
            }

            if (newPassword !== confirmPassword) {
                errorMessage.textContent = 'New password and confirm password do not match.';
                errorMessage.classList.remove('hidden');
                return;
            }

            // Simulate password change (replace with actual backend API call)
            errorMessage.textContent = 'Password changed successfully!';
            errorMessage.classList.remove('error-message');
            errorMessage.classList.add('text-green-600');
            errorMessage.classList.remove('hidden');
            changePasswordForm.reset();
        });

        // Cancel button redirects to profile page
        cancelBtn.addEventListener('click', () => {
            window.location.href = '{% url "Users:Profile" %}';
        });
    </script>
</body>
</html>
