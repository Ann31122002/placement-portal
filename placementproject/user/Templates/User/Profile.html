{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Placement Training Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f3e8ff, #e6e6fa);
        }
        .navbar {
            transition: background 0.3s ease;
            background: linear-gradient(180deg, #6b46c1, #8e5af0);
        }
        .navbar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(2px);
            transition: all 0.3s ease;
        }
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .btn {
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            background: linear-gradient(to right, #6b46c1, #8e5af0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
        }
        .profile-img {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .profile-img:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="min-h-screen">
        <!-- Navbar -->
        <div id="navbar" class="navbar bg-purple-900 text-white p-4 md:p-6 shadow-lg z-20">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="{% url 'Users:HomePage' %}" class="block py-2 px-4 bg-purple-600 rounded-lg text-lg hover:bg-purple-700">Home</a>
                    <h2 class="text-2xl md:text-3xl font-bold">Placement Portal</h2>
                </div>
                <div class="flex items-center space-x-6">
                    <nav class="hidden md:flex space-x-6">
                        <!-- <a href="index.html#overview" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Overview</a> -->
                        <!-- <a href="index.html#training" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Training</a> -->
                        <a href="{% url 'Users:HomePage' %}" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Home</a>
                        <a href="{% url 'Users:Profile' %}" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Profile</a>
                        <a href="{% url 'Users:ChangePassword' %}" class="block py-2 px-4 rounded-lg text-lg hover:bg-purple-700">Change Password</a>
                    </nav>
                    <a href="{% url 'Users:Logout' %}" class="block py-2 px-4 bg-purple-600 rounded-lg text-lg hover:bg-purple-700">Logout</a>
                    <!-- Mobile Menu Toggle -->
                    <button id="menuToggle" class="md:hidden p-2 bg-purple-600 text-white rounded-lg shadow-md hover:bg-purple-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
            <!-- Mobile Menu -->
            <nav id="mobileMenu" class="md:hidden mt-4 space-y-2 hidden">
                <a href="index.html#overview" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Overview</a>
                <a href="index.html#training" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Training</a>
                <a href="index.html#assessments" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Assessments</a>
                <a href="index.html#resources" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Resources</a>
                <a href="{% url 'Users:Profile' %}" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Profile</a>
                <a href="#" class="block py-2 px-4 bg-purple-800 rounded-lg text-lg hover:bg-purple-700">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-auto">
            <!-- Profile Section -->
            <section id="profile" class="mb-10">
                <h1 class="text-4xl font-bold mb-6">Your Profile</h1>
                <div class="card bg-white p-6 rounded-2xl shadow-lg grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Profile Picture -->
                    <div class="flex flex-col items-center p-4">
                        <img src="{{Profile.user_photo.url}}" alt="Profile Picture" class="profile-img rounded-full mb-4 w-32 h-32 object-cover">
                        <button id="uploadPicture" class="btn bg-gradient-to-r from-purple-500 to-purple-700 text-white px-4 py-2 rounded-lg font-semibold"><a href="{% url 'Users:EditProfile' %}" >Change Picture</a></button>
                    </div>
                    <!-- Profile Details -->
                    <div class="col-span-2 p-4">
                        <form id="profileForm" class="space-y-4">
                            <div>
                                <label for="name" class="block text-gray-600 font-semibold">Name</label>
                                <input type="text" id="name" value="{{Profile.user_name}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="email" class="block text-gray-600 font-semibold">Email</label>
                                <input type="email" id="email" value="{{Profile.user_email}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="phone" class="block text-gray-600 font-semibold">Phone</label>
                                <input type="tel" id="phone" value="{{Profile.user_contact}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">Gender</label>
                                <input type="text" id="profession" value="{{Profile.user_gender}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="college" class="block text-gray-600 font-semibold">State</label>
                                <input type="text" id="college" value="{{Profile.user_state}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">City</label>
                                <input type="text" id="profession" value="{{Profile.user_city}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">Address</label>
                                <input type="text" id="profession" value="{{Profile.user_address}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">10th Mark</label>
                                <input type="text" id="profession" value="{{Profile.user_mark10}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">12th Mark</label>
                                <input type="text" id="profession" value="{{Profile.user_mark12}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div>
                                <label for="profession" class="block text-gray-600 font-semibold">Mark in Degree/BTech</label>
                                <input type="text" id="profession" value="{{Profile.user_mark}}" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" disabled>
                            </div>
                            <div class="flex space-x-4">
                                <button type="button" id="" class="btn bg-gradient-to-r from-purple-500 to-purple-700 text-white px-6 py-2 rounded-lg font-semibold"><a href="{% url 'Users:EditProfile' %}" >Edit Profile</a></button>
                                <button type="submit" id="saveProfile" class="btn bg-gradient-to-r from-green-500 to-green-700 text-white px-6 py-2 rounded-lg font-semibold hidden">Save Changes</button>
                                <button type="button" id="cancelEdit" class="btn bg-gradient-to-r from-red-500 to-red-700 text-white px-6 py-2 rounded-lg font-semibold hidden">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        const editProfileBtn = document.getElementById('editProfile');
        const saveProfileBtn = document.getElementById('saveProfile');
        const cancelEditBtn = document.getElementById('cancelEdit');
        const profileForm = document.getElementById('profileForm');
        const inputs = profileForm.querySelectorAll('input, textarea');

        // Mobile menu toggle
        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Smooth scrolling for nav links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
                if (window.innerWidth < 768) {
                    mobileMenu.classList.add('hidden');
                }
            });
        });

        // Profile editing functionality
        editProfileBtn.addEventListener('click', () => {
            inputs.forEach(input => input.disabled = false);
            editProfileBtn.classList.add('hidden');
            saveProfileBtn.classList.remove('hidden');
            cancelEditBtn.classList.remove('hidden');
        });

        cancelEditBtn.addEventListener('click', () => {
            inputs.forEach(input => input.disabled = true);
            profileForm.reset(); // Reset to initial values
            editProfileBtn.classList.remove('hidden');
            saveProfileBtn.classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
        });

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            inputs.forEach(input => input.disabled = true);
            editProfileBtn.classList.remove('hidden');
            saveProfileBtn.classList.add('hidden');
            cancelEditBtn.classList.add('hidden');
            alert('Profile updated successfully!');
        });

        // Placeholder for profile picture upload
        //document.getElementById('uploadPicture').addEventListener('click', () => {
        //    alert('Profile picture upload functionality is not implemented yet.');
        //});
    </script>
</body>
</html>
