{% extends 'Admin/JobPost.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Manage Questions</title>
    <style>
        body { font-family: Arial; background: #f8f8f8; padding: 20px; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background: #007bff; color: white; }
        a.button { padding: 6px 12px; background: #dc3545; color: white; text-decoration: none; border-radius: 4px; }
        .top-links { text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body><br><br><br>
    <h2>Manage Questions</h2>
    <div class="top-links">
        <a href="{% url 'Interview:add_question' %}" class="button" style="background:#28a745;">Add Question</a>
        <a href="{% url 'Interview:admin_dashboard' %}" class="button" style="background:#007bff;">Back to Dashboard</a>
    </div>
    <table>
        <tr>
            <th>ID</th>
            <th>Question</th>
            <th>Action</th>
        </tr>
        {% for q in questions %}
        <tr>
            <td>{{ q.id }}</td>
            <td>{{ q.text }}</td>
            <td><a href="{% url 'Interview:delete_question' q.id %}" class="button">Delete</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No questions found.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
{% endblock %}
